name: Terraform CI — Pull Request
# TRIGGERS: ONLY on Pull Request events

on: 
    pull_request:
    branches:
      - feature/*  
      - develop 

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.9.8"

jobs:
  terraform-plan-ci:
    name: Terraform Plan
    runs-on: ubuntu-latest  # Github runner

    # permissions:
    #   id-token: write                   #  Required for AWS OIDC
    #   contents: read                    #  Required for checkout
    #   pull-requests: write              #  Optional: if you want to add comments

    steps:
      #  CHECKOUT CODE FROM REPOSITORY
      - name: Checkout repository
        uses: actions/checkout@v4

      # # AUTH AWS — OIDC (NO KEYS REQUIRED)
      # - name: Authenticate AWS via OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy
      #     aws-region: ${{ env.AWS_REGION }}

   # Authenticate to AWS
        # Authenticate to AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }} 

       # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # - name: Terraform Format Check
      #   run: terraform fmt -check

      # - name: Terraform Validate
      #   run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan \
        -refresh=false \             # Huge speedup
        -var-file=env/dev.tfvars  # Use dev variables for PRs (no secrets)
